# XcodeGen spec for PagerCompanion — the source of truth for the Xcode project.
#
# The generated `PagerCompanion.xcodeproj` is not committed (see .gitignore);
# regenerate it with `make gen` (or `make -C ios gen` from the repo root).
# Docs: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: PagerCompanion

options:
  deploymentTarget:
    iOS: "16.0"
  # Seeds PRODUCT_BUNDLE_IDENTIFIER. The real prefix comes from the
  # BUNDLE_ID_PREFIX build setting defined in Config/Base.xcconfig.
  bundleIdPrefix: $(BUNDLE_ID_PREFIX)

packages:
  PagerKit:
    path: PagerKit

targets:
  PagerCompanion:
    type: application
    platform: iOS
    sources:
      - App
    resources:
      # Nothing ships as a bundle resource yet: Info.plist is wired through
      # `info.path` below, so it must be excluded from the copy phase.
      - path: Resources
        excludes:
          - Info.plist
    info:
      # XcodeGen regenerates this file from `properties` on every `make gen`;
      # keys edited only in the plist are lost, so keep them here.
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Pager Companion
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: Pager Companion talks to your LilyGo pager over Bluetooth.
        NSLocationWhenInUseUsageDescription: Pager Companion uses your location for the pager's "auto" weather forecast.
        NSLocalNetworkUsageDescription: Pager Companion reaches your Telegram bridge (and, in debug builds, the pager emulator) on this network.
        # The tg-bridge URL is user-configured and often plain http:// on a LAN
        # box or VPS; without this ATS refuses every tg.* call (RH9).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - bluetooth-central
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: PagerKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).pagercompanion"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  PagerCompanion:
    build:
      targets:
        PagerCompanion: all
    run:
      config: Debug
    # No test target: PagerKit's XCTest suite runs with `swift test`
    # (`make test` on macOS, `make test-linux` in Docker), not via xcodebuild.
