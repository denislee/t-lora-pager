;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = tlora_pager
src_dir = src
; To build a LilyGoLib example instead of this firmware, comment out the line
; above and point src_dir at any example directory under
; lib/LilyGoLib/examples/ (the copy PlatformIO fetches lives under libdeps_dir), e.g.:
; src_dir = ${platformio.libdeps_dir}/${platformio.default_envs}/LilyGoLib/examples/helloworld

boards_dir = ./boards

[env_arduino]
framework = arduino
platform = espressif32@6.10.0
upload_speed =  921600
monitor_speed = 115200
board_build.filesystem = fatfs
board_build.partitions = lib/LilyGoLib/examples/factory/partitions.csv
build_unflags =
    -D ARDUINO_USB_MODE=1

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; -U ARDUINO_USB_CDC_ON_BOOT        ; Disable Serial output

    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_CC1101
    -D RADIOLIB_EXCLUDE_SI443X
    -D RADIOLIB_EXCLUDE_SX128X
    ; -D RADIOLIB_EXCLUDE_NRF24
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_STM32WLX
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL
    -Wnarrowing

    -D ARDUINO_LILYGO_LORA_SX1262   ; Used SX1262 LoRa
    ; -D ARDUINO_LILYGO_LORA_CC1101 ; Used CC1101 LoRa
    ; -D ARDUINO_LILYGO_LORA_SX1280 ; Used SX1280 LoRa
    ; -D ARDUINO_LILYGO_LORA_LR1121 ; Used LR1121 LoRa
    ; -D ARDUINO_LILYGO_LORA_SI4432 ; Used SI4432 LoRa

    ; BLE (hal/ble_stack: HID keyboard + PagerLink) only uses the peripheral
    ; role (NimBLEServer) — no NimBLEClient/NimBLEScan call sites anywhere in
    ; src/. Drop the unused central/observer roles from the NimBLE build.
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

    ; HID and PagerLink notifies share NimBLE's msys pool (default 12 x 256 B).
    ; 24 blocks (~3 KB more heap) let a bulk PagerLink window run while
    ; link_tx keeps a reserve free for key reports (P7.31). Note: the flag name
    ; really is MSYS1, no underscore (nimconfig.h back-compat spelling).
    -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24

monitor_filters =
	default
	esp32_exception_decoder

lib_deps = 
    lvgl/lvgl @ ^9.4.0
    jgromes/RadioLib @ ^7.4.0
    lewisxhe/XPowersLib@^0.3.1
    lewisxhe/SensorLib @ ^0.3.3
    mikalhart/TinyGPSPlus @ ^1.0.3
    h2zero/NimBLE-Arduino @ ^2.2.3


[env:twatchs3]
extends = env_arduino
board = lilygo-t-watch-s3
upload_speed = 921600
build_flags =
    ${env_arduino.build_flags}
    -D ARDUINO_T_WATCH_S3
    -I variants/lilygo_twatch_s3
lib_deps = 
    ${env_arduino.lib_deps}

[env:twatch_ultra]
extends = env_arduino
board = lilygo-t-watch-ultra
build_flags =     
    ${env_arduino.build_flags}
    -I variants/lilygo_twatch_ultra
    -D ARDUINO_T_WATCH_S3_ULTRA
lib_deps =     
    ${env_arduino.lib_deps}
    https://github.com/lewisxhe/ST25R3916-fork.git
    https://github.com/lewisxhe/NFC-RFAL-fork.git

[env:tlora_pager]
extends = env_arduino
board = lilygo-t-lora-pager
build_flags =
    ${env_arduino.build_flags}
    -D ARDUINO_T_LORA_PAGER
    ; Pager has an ST25R3916 NFC reader. Needs to be visible to both src/
    ; (app_nfc.cpp, peripherals.cpp) and the LilyGoLib pager class that
    ; defines `NFCReader`. Upstream factory example does the same.
    -D USING_ST25R3916
    -I variants/lilygo_tlora_pager

lib_deps =
    ${env_arduino.lib_deps}
    adafruit/Adafruit TCA8418 @ ^1.0.2
    adafruit/Adafruit BusIO @ ^1.17.0
    https://github.com/lewisxhe/ST25R3916-fork.git
    https://github.com/lewisxhe/NFC-RFAL-fork.git
    ; 4.x is gone from the PlatformIO registry; pin the GitHub tag.
    https://github.com/ewpa/LibSSH-ESP32.git#4.2.0

; Pager build with the input-stutter profiler compiled in (INPUT_STUTTER_PLAN.md
; IS.0, src/core/input_profile.h). Prints `[prof]` lines on the serial monitor:
; instance-lock holds, keyboard-reader waits, key latency, frame times, spans
; and a focus-group dump on every app switch.
[env:tlora_pager_profile]
extends = env:tlora_pager
build_flags =
    ${env:tlora_pager.build_flags}
    -D INPUT_PROFILE



; ! ===============================Emulator=======================================
[env_emulator]
platform = native@^1.1.3
extra_scripts = 
  pre:support/sdl2_paths.py ; Tries to find SDL2 include and lib paths on your system - specifically for MacOS w/ Homebrew
  post:support/sdl2_build_extra.py
; Surface dead code in our own sources. build_src_flags applies to src/ only,
; so vendored lib/ and .pio/libdeps (LVGL, SDL glue) are not affected. Symbols
; used only on hardware belong inside the same `#ifdef ARDUINO` as their callers.
build_src_flags =
  -Wunused-function
  -Wunused-variable
  -Wunused-but-set-variable
build_flags =
  ; Don't use lv_conf.h. Tweak params via platfom.ini.
  -D LV_CONF_SKIP
  -D LV_CONF_INCLUDE_SIMPLE
  -D ARDUINO_LILYGO_LORA_SX1262
  ; Add more defines below to overide lvgl:/src/lv_conf_simple.h
  -D LV_USE_PRIVATE_API
  -D SDL_ZOOM=1
  -D LV_SDL_INCLUDE_PATH="\"SDL2/SDL.h\""
  ; LVGL memory options, setup for the demo to run properly
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_SIZE="(600U * 480U * 2)"
  -D LV_USE_FLOAT=1
  -D LV_FONT_MONTSERRAT_48=1
  -D LV_FONT_MONTSERRAT_20=1
  -D LV_FONT_MONTSERRAT_24=1
  -D LV_FONT_MONTSERRAT_22=1
  -D LV_FONT_MONTSERRAT_28=1
  -D LV_FONT_MONTSERRAT_32=1
  -D LV_FONT_MONTSERRAT_18=1
  -D LV_FONT_MONTSERRAT_16=1
  -D LV_FONT_MONTSERRAT_14=1
  -D LV_FONT_MONTSERRAT_12=1
  -D LV_FONT_MONTSERRAT_10=1
  -D LV_FONT_MONTSERRAT_26=1
  -D LV_FONT_MONTSERRAT_30=1
  -D LV_FONT_UNSCII_8=1
  -D LV_FONT_UNSCII_16=1
  ; -D LV_LOG_LEVEL=LV_LOG_LEVEL_INFO
  -D LV_LOG_PRINTF=1
  ; Add recursive dirs for hal headers search
  !python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/sdl2')]))"
  -lSDL2
  ; SDL drivers options
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_DRV_NO_CONF
  -D LV_USE_SDL

lib_deps =
  ; Use direct URL, because package registry is unstable
  lvgl@9.2.2
  https://github.com/Xinyuan-LilyGO/LilyGoLib
lib_archive = false


[env:emulator_lora_pager]
extends = env_emulator
build_flags =
  ${env_emulator.build_flags}
  -D SDL_HOR_RES=480
  -D SDL_VER_RES=222
  -D ARDUINO_T_LORA_PAGER
  -D USING_INPUT_DEV_KEYBOARD
lib_deps =
  ${env_emulator.lib_deps}

[env:emulator_twatchs3]
extends = env_emulator
build_flags =
  ${env_emulator.build_flags}
  -D SDL_HOR_RES=240
  -D SDL_VER_RES=240
  -D ARDUINO_T_WATCH_S3
lib_deps =
  ${env_emulator.lib_deps}

[env:emulator_watch_ultra]
extends = env_emulator
build_flags =
  ${env_emulator.build_flags}
  -D SDL_HOR_RES=502
  -D SDL_VER_RES=410
  -D ARDUINO_T_WATCH_S3_ULTRA
lib_deps =
  ${env_emulator.lib_deps}

; Host-side unit tests for pure-logic modules. Pulls only files that have no
; Arduino / LilyGoLib / mbedtls dependency so they compile cleanly on the
; native platform. Run with:  pio test -e native_test
[env:native_test]
platform = native@^1.1.3
test_framework = unity
test_build_src = true
build_src_filter = -<*> +<hal/notes_path.cpp> +<hal/result.cpp> +<hal/str_encode.cpp>
  +<hal/link/link_frame.cpp> +<hal/link/link_json.cpp> +<hal/link/link_rpc.cpp>
  +<hal/link/link_xfer.cpp> +<hal/link/crc_cache.cpp> +<hal/notes_manifest.cpp> +<hal/weather_payload.cpp>
; Regenerates test/test_link_frame/link_vectors_gen.h from protocol/vectors/.
extra_scripts = pre:support/gen_link_vectors.py
build_flags =
  -std=gnu++17
  -Isrc
